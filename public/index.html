<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عابد مافيا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0a10;--pn:#16141f;--ac:#c8102e;--tx:#f2ede4;--mu:#9a93a6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:fixed;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(11,10,16,.94) 35%);text-align:center}
#msg{font-size:17px;font-weight:700;margin-bottom:6px;min-height:24px}
#sub{font-size:13px;color:var(--mu);margin-bottom:8px;min-height:16px}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 20px;background:var(--ac);color:#fff;margin:3px}
button.g{background:#2a2636}button:disabled{opacity:.35}
.ov{position:fixed;inset:0;background:rgba(5,4,8,.92);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.ov.on{display:flex}
.box{background:var(--pn);border:1px solid #2d2939;border-radius:18px;padding:22px;width:100%;max-width:400px;text-align:center}
h1{margin:0 0 4px;font-size:32px}
input{width:100%;margin:5px 0;padding:11px;border-radius:10px;border:1px solid #333;background:#0f0d16;color:var(--tx);font:inherit;text-align:center}
hr{border:0;border-top:1px solid #2d2939;margin:14px 0}
#lobby{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px;background:linear-gradient(rgba(11,10,16,.95),transparent);text-align:center;display:none}
#lobby b{font-size:34px;letter-spacing:8px;color:#ffd23f}
#ppl{font-size:13px;color:var(--mu);margin-top:4px}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;display:none}
#card{height:200px;border-radius:16px;margin:14px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#2a0a12,#2a0a12 10px,#1e0710 10px,#1e0710 20px);border:2px solid var(--ac);font-size:60px;user-select:none;-webkit-user-select:none}
#card small{font-size:14px;padding:0 12px;margin-top:6px}#card b{font-size:26px}
#chat{position:fixed;left:0;right:0;bottom:0;height:52vh;background:var(--pn);border-top:2px solid var(--ac);display:none;flex-direction:column;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
#chat.on{display:flex}
#tabs{display:flex;gap:4px;padding:6px 8px;align-items:center}#tabs button{padding:8px 14px;margin:0}#tabs .x{margin-right:auto}
#log{flex:1;overflow:auto;padding:6px 12px;font-size:15px;text-align:right}
#log div{margin:4px 0;word-break:break-word}#log b{color:#ffd23f}#log .me b{color:#7be0a0}
#row{display:flex;gap:6px;padding:8px}#row input{margin:0;text-align:right;flex:1}#row button{margin:0}
#badge{background:#ffd23f;color:#000;border-radius:10px;padding:0 6px;margin-right:4px;font-size:12px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#c8102e;padding:8px 16px;border-radius:10px;display:none;z-index:9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lobby"><div style="font-size:13px;color:var(--mu)">كود الغرفة · شاركه مع اللاعبين</div><b id="rc"></b><div id="ppl"></div></div>
<div id="top"><button class="g" id="chatbtn">💬<span id="badge"></span></button><button class="g" id="cardbtn">🃏 كارتي</button></div>
<div id="ui"><div id="msg"></div><div id="sub"></div><div id="btns"></div></div>
<div id="chat"><div id="tabs"></div><div id="log"></div><div id="row"><input id="ci" maxlength="200" placeholder="اكتب رسالة..."><button id="cs">إرسال</button></div></div>
<div id="toast"></div>

<div class="ov on" id="home"><div class="box">
<h1>🎭 عابد مافيا</h1>
<div style="color:var(--mu);font-size:14px;margin-bottom:10px">لعبة جماعية ثلاثية الأبعاد · ٦ إلى ١٥ لاعب</div>
<input id="nm" placeholder="اسمك في اللعبة" maxlength="14">
<button id="mk" style="width:100%">➕ إنشاء غرفة</button>
<hr>
<input id="cd" placeholder="كود الغرفة" maxlength="4" style="text-transform:uppercase;letter-spacing:6px">
<button id="jn" class="g" style="width:100%">🚪 انضمام</button>
</div></div>

<div class="ov" id="cardov"><div class="box">
<div id="card">❓</div>
<div style="color:var(--mu);font-size:13px">اضغط مطوّلاً لإظهار كارتك، وإذا شلت إصبعك يختفي</div>
<button id="hold">🔒 اضغط مطوّلاً</button>
<button class="g" id="cclose">إغلاق</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R={mafia:{n:'مافيا',e:'🔪',d:'تقتلون كل ليلة مع فريقكم. لا تنكشفون!'},doctor:{n:'الدكتور',e:'💉',d:'كل ليلة تنقذ لاعب من القتل (حتى نفسك).'},detective:{n:'المحقق',e:'🔍',d:'كل ليلة تسأل: هذا اللاعب مافيا لو لا؟'},citizen:{n:'مواطن',e:'🧑',d:'اكشف المافيا بالنقاش والتصويت.'}};
const $=id=>document.getElementById(id);
let ws,S=null,sel=null,key='',chars={};
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};
$('nm').value=ls.get('abed_name')||'';
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2500)}

// ---------- network
function conn(cb){
  ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);
  ws.onopen=()=>cb&&cb();
  ws.onmessage=e=>{const d=JSON.parse(e.data);
    if(d.t==='state'){S=d.s;ls.set('abed_room',JSON.stringify({code:S.code,id:S.me}));render()}
    else if(d.t==='err')toast(d.m);
    else if(d.t==='gone'){ls.del('abed_room');S=null;$('home').classList.add('on')}};
  ws.onclose=()=>{if(S)toast('انقطع الاتصال... نعيد المحاولة');setTimeout(()=>conn(resume),1500)};
}
const tx=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function resume(){const s=JSON.parse(ls.get('abed_room')||'null');if(s)tx({t:'resume',...s})}
conn(resume);
$('mk').onclick=()=>{ls.set('abed_name',$('nm').value);tx({t:'create',name:$('nm').value})};
$('jn').onclick=()=>{ls.set('abed_name',$('nm').value);tx({t:'join',name:$('nm').value,code:$('cd').value})};

// ---------- 3D scene
const cv=$('c'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;
const sc=new THREE.Scene();sc.background=new THREE.Color(0x0b0a10);sc.fog=new THREE.Fog(0x0b0a10,10,28);
const cam=new THREE.PerspectiveCamera(50,1,.1,60),amb=new THREE.AmbientLight(0xffffff,.55);sc.add(amb);
const spot=new THREE.SpotLight(0xffd9a0,1.3,30,.8,.5);spot.position.set(0,9,0);spot.castShadow=true;sc.add(spot);
const M=(c,r=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const flr=new THREE.Mesh(new THREE.CircleGeometry(15,48),M(0x1a1420));flr.rotation.x=-Math.PI/2;flr.receiveShadow=true;sc.add(flr);
const T=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;sc.add(o);return o};
T(new THREE.CylinderGeometry(2.5,2.5,.2,48),M(0x4a2a18,.5),0,1.1,0);T(new THREE.CylinderGeometry(2.2,2.2,.22,48),M(0x0f4a2c),0,1.1,0);
T(new THREE.CylinderGeometry(.4,.7,1.1,16),M(0x2a160c),0,.55,0);T(new THREE.CylinderGeometry(.06,.06,.4,12),M(0xf5ecd0),0,1.4,0);
const flame=T(new THREE.SphereGeometry(.07,8,8),new THREE.MeshBasicMaterial({color:0xffb347}),0,1.65,0);
const cl=new THREE.PointLight(0xffa040,.9,9);cl.position.y=1.8;sc.add(cl);
for(let i=0;i<8;i++){const a=i*Math.PI/4+.2;T(new THREE.CylinderGeometry(.35,.35,6,12),M(0x2c2434),Math.cos(a)*13,3,Math.sin(a)*13)}
const ring=new THREE.Mesh(new THREE.TorusGeometry(.65,.06,8,32),new THREE.MeshBasicMaterial({color:0xffd23f}));ring.rotation.x=Math.PI/2;ring.visible=false;sc.add(ring);

function drawLabel(g,t){const c=g.userData.lc,x=c.getContext('2d');x.clearRect(0,0,256,64);x.fillStyle='rgba(0,0,0,.7)';x.fillRect(6,6,244,52);x.fillStyle='#fff';x.font='bold 26px Tajawal,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,128,33,230);g.userData.lt.needsUpdate=true;g.userData.ltxt=t}
const SK=[0xf1c9a0,0xd9a273,0xa8754f,0x7a4f32],HC=[0x1a1208,0x4a2a14,0x8a5a2b,0x222222,0x6b6b6b];
function makeChar(i){
  const g=new THREE.Group(),b=new THREE.Group();g.add(b);
  const sk=M(SK[i%4]),hr=M(HC[(i*3)%5],.9),shirt=M(new THREE.Color().setHSL((i*.137)%1,.5,.4));shirt.userData.col=shirt.color.clone();
  const add=(geo,m,x,y,z,p=b)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o};
  const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d),S_=(r,s=16)=>new THREE.SphereGeometry(r,s,s),CY=(a,c,h,s=16)=>new THREE.CylinderGeometry(a,c,h,s);
  add(CY(.3,.38,.95),shirt,0,1.08,0);add(B(.07,.38,.03),M(0xaa1122),0,1.2,.35);add(CY(.09,.09,.12,10),sk,0,1.62,0);
  add(S_(.27,20),sk,0,1.85,0);
  [-1,1].forEach(s=>{add(S_(.035,8),M(0x111111),s*.09,1.9,.245);add(B(.1,.02,.02),hr,s*.09,1.96,.25);
    add(CY(.07,.07,.7,10),shirt,s*.34,1.2,.3).rotation.x=Math.PI/2.3;add(S_(.075,10),sk,s*.3,1.12,.62)});
  add(S_(.04,8),sk,0,1.84,.27);add(B(.1,.02,.02),M(0x7a2a2a),0,1.75,.25);
  const v=i%5,half=(r,c)=>{const o=add(new THREE.SphereGeometry(r,20,12,0,Math.PI*2,0,Math.PI/2),c,0,1.87,0);return o};
  if(v===0)half(.29,hr);
  if(v===1){add(CY(.42,.42,.03,24),M(0x222222),0,2.07,0);add(CY(.2,.23,.22,20),M(0x222222),0,2.17,0);add(CY(.235,.235,.05,20),M(0xaa1122),0,2.1,0)}
  if(v===3)half(.3,M(new THREE.Color().setHSL((i*.3)%1,.6,.35)));
  if(v===4){half(.29,hr);add(B(.3,.03,.22),M(0x224488),0,2.08,.3)}
  add(B(.9,.08,.9),M(0x2a160c),0,.55,0,g);add(B(.9,.9,.08),M(0x2a160c),0,1,-.46,g);
  const c=document.createElement('canvas');c.width=256;c.height=64;const t=new THREE.CanvasTexture(c);
  const lb=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false}));lb.scale.set(1.6,.4,1);lb.position.y=2.6;lb.renderOrder=9;g.add(lb);
  g.userData={b,shirt,lc:c,lt:t};g.traverse(o=>o.isMesh&&(o.userData.pid=1));return g;
}
function buildSeats(){
  Object.values(chars).forEach(c=>{sc.remove(c.g);sc.remove(c.card)});chars={};const n=S.players.length;
  S.players.forEach((p,i)=>{const a=i/n*Math.PI*2,g=makeChar(i);g.position.set(Math.cos(a)*3.25,0,Math.sin(a)*3.25);g.lookAt(0,0,0);sc.add(g);
    g.traverse(o=>{if(o.isMesh)o.userData.pid=p.id});
    const cd=new THREE.Mesh(new THREE.BoxGeometry(.34,.02,.5),M(0x8a0f22));cd.position.set(Math.cos(a)*2,1.23,Math.sin(a)*2);cd.rotation.y=Math.PI/2-a;sc.add(cd);
    chars[p.id]={g,card:cd,a}});
}
let az=.6,dist=11,gl=0,tg=0;
function size(){const w=innerWidth,h=innerHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();dist=w<h?15:11}
addEventListener('resize',size);size();
let dn=null,mv=0;
cv.addEventListener('pointerdown',e=>{dn={x:e.clientX,az};mv=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!dn)return;const d=e.clientX-dn.x;mv=Math.max(mv,Math.abs(d));az=dn.az-d*.006});
cv.addEventListener('pointerup',e=>{if(!dn)return;dn=null;if(mv<6)pick(e)});
const rc=new THREE.Raycaster();
function pick(e){rc.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
  const h=rc.intersectObjects(Object.values(chars).map(c=>c.g),true)[0];if(h)tap(h.object.userData.pid)}
(function loop(t){requestAnimationFrame(loop);gl+=(tg-gl)*.05;amb.intensity=.55-.42*gl;spot.intensity=1.3-.9*gl;
  sc.background.setRGB(.04-.03*gl,.04-.03*gl,.06-.04*gl);sc.fog.color.copy(sc.background);
  if(!dn)az+=.0008;cam.position.set(Math.cos(az)*dist,6.5,Math.sin(az)*dist);cam.lookAt(0,1.2,0);
  flame.scale.setScalar(1+Math.sin(t/90)*.15);cl.intensity=.8+Math.sin(t/110)*.15+gl*.5;
  const c=sel&&chars[sel];if(c){ring.position.set(c.g.position.x,.1,c.g.position.z);ring.scale.setScalar(1+Math.sin(t/200)*.06)}
  ren.render(sc,cam)})(0);

// ---------- game UI
function ui(msg,sub,btns){$('msg').textContent=msg||'';$('sub').textContent=sub||'';const b=$('btns');b.innerHTML='';
  (btns||[]).forEach(x=>{const e=document.createElement('button');e.textContent=x.t;if(x.g)e.className='g';if(x.off)e.disabled=true;e.onclick=x.f;b.appendChild(e)})}
const me=()=>S.players.find(p=>p.id===S.me);
function needTarget(){ // can the player pick a target right now?
  const m=me(),ph=S.phase;if(!m.alive)return false;
  if(ph==='night')return['mafia','doctor','detective'].includes(m.role)&&!S.acted;
  if(ph==='day')return!S.voted;return false}
function valid(id){const m=me(),p=S.players.find(x=>x.id===id);if(!p||!p.alive)return false;
  if(S.phase==='night'){if(m.role==='mafia')return p.role!=='mafia';if(m.role==='detective')return id!==S.me;return true}
  return id!==S.me}
function tap(id){if(!S||!needTarget()||!valid(id))return;sel=id;panel()}
function send(){if(!sel)return;tx({t:S.phase==='night'?'act':'vote',target:sel});sel=null;ring.visible=false}
const nightTxt={mafia:'🔪 اختر الضحية مع فريقك',doctor:'💉 منو تنقذ هالليلة؟',detective:'🔍 منو تشك فيه؟'};
function panel(){
  const m=me(),ph=S.phase,selName=sel&&S.players.find(p=>p.id===sel);ring.visible=!!sel&&needTarget();
  const force=S.host&&(ph==='night'||ph==='day')?[{t:'⏭ تخطي المنتظرين',g:true,f:()=>tx({t:'force'})}]:[];
  if(ph==='lobby'){const n=S.players.length;
    return ui(S.host?'أنت صاحب الغرفة':'ننتظر صاحب الغرفة يبدأ...',n+' / 15 لاعب (الحد الأدنى ٦)',S.host?[{t:'▶ ابدأ اللعبة',off:n<6,f:()=>tx({t:'start'})}]:[])}
  if(ph==='end')return ui(S.msg,S.players.map(p=>R[p.role].e+' '+p.name).join(' · '),S.host?[{t:'🔁 لعبة جديدة',f:()=>tx({t:'again'})}]:[]);
  if(ph==='night'){
    if(!m.alive)return ui('💀 أنت ميت — تفرّج بصمت','',force);
    if(S.acted)return ui('✅ تم اختيارك',(S.result||'')+(S.mpicks.length?' | '+S.mpicks.join('، '):'')+' · ننتظر البقية',force);
    if(needTarget())return ui(nightTxt[m.role],S.mpicks.join('، ')||'اضغط على الشخصية على الطاولة',[{t:selName?'تأكيد: '+selName.name:'تأكيد',off:!sel,f:send},...force]);
    return ui('🌙 الليل نزل... غمّض عيونك وانتظر',S.result||'',force)}
  if(ph==='day'){
    if(!m.alive)return ui(S.msg,'💀 أنت ميت — تفرّج',force);
    if(S.voted)return ui(S.msg,'✅ صوّتت · ينتظر '+S.wait+' لاعب',force);
    return ui(S.msg,(S.result||'')+' نقاش ثم صوّت: اضغط على المشتبه فيه',[{t:selName?'🗳 إعدام '+selName.name:'🗳 اختر لاعب',off:!sel,f:send},{t:'امتنع',g:true,f:()=>{tx({t:'vote',target:'skip'});sel=null}},...force])}
}
function render(){
  $('home').classList.remove('on');
  const k=S.players.map(p=>p.id).join();if(k!==key){key=k;buildSeats()}
  const lob=S.phase==='lobby';$('lobby').style.display=lob?'block':'none';$('rc').textContent=S.code;
  $('ppl').textContent=S.players.map(p=>p.name+(p.online?'':' ⚪')).join(' · ');
  const m=me();$('top').style.display='block';$('cardbtn').style.display=!lob&&m.role?'inline-block':'none';
  S.players.forEach(p=>{const c=chars[p.id];if(!c)return;
    const rl=p.role&&(S.phase==='end'||!p.alive)?' ('+R[p.role].n+')':'',tl=S.tally[p.id]?' 🗳'+S.tally[p.id]:'';
    const t=p.name+(p.id===S.me?' ⭐':'')+rl+tl;if(c.g.userData.ltxt!==t)drawLabel(c.g,t);
    c.g.userData.b.rotation.x=p.alive?0:-.7;c.g.userData.shirt.color.copy(p.alive?c.g.userData.shirt.userData.col:new THREE.Color(0x555555))});
  tg=S.phase==='night'?1:0;if(sel&&!needTarget())sel=null;panel();chatUpdate();
}
// ---------- chat
let ctab='all',copen=false;const seenN={all:0,mafia:0};
const isMafia=()=>S.phase!=='lobby'&&me().role==='mafia';
function canWrite(ch){const m=me(),ph=S.phase;
  if(ch==='all')return ph==='lobby'||ph==='end'||(ph==='day'&&m.alive);
  return m.role==='mafia'&&m.alive&&(ph==='night'||ph==='day')}
function chatUpdate(){
  if(ctab==='mafia'&&!isMafia())ctab='all';
  const L={all:S.chat,mafia:S.mchat};
  if(copen)seenN[ctab]=L[ctab].length;
  const un=['all',...(isMafia()?['mafia']:[])].reduce((a,k)=>a+Math.max(0,L[k].length-seenN[k]),0);
  $('badge').textContent=un?un:'';
  $('chat').classList.toggle('on',copen);if(!copen)return;
  const tabs=$('tabs');tabs.innerHTML='';
  [['all','💬 الجميع'],...(isMafia()?[['mafia','🔪 المافيا']]:[])].forEach(([k,l])=>{const b=document.createElement('button');
    const u=Math.max(0,L[k].length-seenN[k]);b.textContent=l+(u?' ('+u+')':'');if(ctab!==k)b.className='g';b.onclick=()=>{ctab=k;chatUpdate()};tabs.appendChild(b)});
  const x=document.createElement('button');x.textContent='✕';x.className='g x';x.onclick=()=>{copen=false;chatUpdate()};tabs.appendChild(x);
  const log=$('log');log.innerHTML='';
  L[ctab].forEach(m=>{const d=document.createElement('div'),b=document.createElement('b');if(m.id===S.me)d.className='me';b.textContent=m.n+': ';d.append(b,document.createTextNode(m.t));log.appendChild(d)});
  log.scrollTop=log.scrollHeight;
  const ok=canWrite(ctab);$('ci').disabled=!ok;$('cs').disabled=!ok;
  $('ci').placeholder=ok?'اكتب رسالة...':(ctab==='all'&&S.phase==='night'?'🌙 الليل صامت':'💀 الكتابة غير متاحة');
}
function sendChat(){const t=$('ci').value.trim();if(!t||$('ci').disabled)return;tx({t:'chat',ch:ctab,text:t});$('ci').value=''}
$('chatbtn').onclick=()=>{copen=!copen;chatUpdate()};
$('cs').onclick=sendChat;$('ci').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
// ---------- secret card
$('cardbtn').onclick=()=>{$('card').innerHTML='❓';$('cardov').classList.add('on')};
$('cclose').onclick=()=>$('cardov').classList.remove('on');
const h=$('hold');
h.addEventListener('pointerdown',e=>{e.preventDefault();const m=me(),r=R[m.role],mates=S.players.filter(p=>p.role==='mafia'&&p.id!==S.me).map(p=>p.name).join('، ');
  $('card').innerHTML=r.e+'<b>'+r.n+'</b><small>'+r.d+(m.role==='mafia'&&mates?' زملاؤك: '+mates:'')+'</small>'});
